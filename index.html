<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14110E">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Despensa">
<title>Compra · Despensa</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<main class="tape">

  <div class="top">
    <div class="total"><span>Total</span><b id="tTotal">$0.00</b></div>
    <div class="bar"><i id="bar"></i></div>
    <div class="subline"><span id="tCount">0 artículos</span><span id="tLeft"></span></div>
  </div>

  <section>
    <div class="eyebrow">Escáner</div>
    <div class="well">
      <video id="video" playsinline muted></video>
      <div class="reticle" id="reticle" hidden><i></i></div>
      <div class="idle" id="idle">Cámara apagada</div>
    </div>
    <div class="row">
      <button id="btnStart">Encender cámara</button>
      <button id="btnTorch" class="ghost" disabled>Luz</button>
      <button id="btnPhoto" class="ghost" hidden>Tomar foto</button>
    </div>
    <input type="file" id="fileCam" accept="image/*" capture="environment" hidden>
    <div id="alert"></div>
  </section>

  <section>
    <div class="eyebrow">Captura manual</div>
    <div class="row">
      <input id="manual" inputmode="numeric" placeholder="Código, o escribe el producto" autocomplete="off">
    </div>
    <div class="row"><button id="btnManual" class="ghost">Agregar a mano</button></div>
  </section>

  <section>
    <div class="eyebrow">Artículos</div>
    <ol id="list"></ol>
    <div class="empty" id="listEmpty">Escanea el primer producto.</div>
  </section>

  <section>
    <div class="eyebrow">Compra</div>
    <div class="half">
      <div><label for="store">Tienda</label><input id="store" placeholder="Chedraui" autocomplete="off"></div>
      <div><label for="budget">Presupuesto</label><input id="budget" inputmode="decimal" placeholder="1500"></div>
    </div>
    <div class="row">
      <button id="btnCsv" class="ghost">Descargar CSV</button>
      <button id="btnCopy" class="ghost">Copiar</button>
    </div>
    <div class="row"><button id="btnReset" class="danger">Cerrar y vaciar</button></div>
    <div class="note">Todo se guarda solo en este teléfono, en cada cambio. Puedes cerrar la pestaña sin perder nada.</div>
  </section>

  <footer>Captura de compra · v1</footer>
</main>

<div class="sheet" id="sheet">
  <div class="card">
    <input class="prod" id="sProd" placeholder="Nombre del producto" autocomplete="off">
    <div class="barcode" id="sCode">—</div>
    <div id="sFlag"></div>
    <div class="half" style="margin-top:10px">
      <div><label for="sTienda">Tienda</label><input id="sTienda" placeholder="Chedraui" autocomplete="off"></div>
      <div><label for="sPrice">Precio unitario</label><input id="sPrice" inputmode="decimal" placeholder="0.00"></div>
    </div>
    <div style="margin-top:14px"><label>Cantidad</label>
      <div class="qty">
        <button id="sMinus" class="ghost">−</button>
        <b id="sQty">1</b>
        <button id="sPlus" class="ghost">+</button>
      </div>
    </div>
    <div class="row" style="margin-top:16px">
      <button id="sCancel" class="ghost">Cancelar</button>
      <button id="sAdd">Agregar</button>
    </div>
  </div>
</div>

<script src="./config.js"></script>
<script src="./app.js"></script>
</body>
</html>
